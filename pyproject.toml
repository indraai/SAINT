[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pysaint"
version = "0.1.0"
description = "Modern SAINT (Systems Analysis of Integrated Networks of Tasks)"
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
dependencies = [
  "numpy", "scipy", "pandas", "pyarrow", "pydantic>=2", "matplotlib",
  "ruamel.yaml", "typer", "rich", "networkx",
]

[project.optional-dependencies]
web = ["fastapi>=0.110", "uvicorn>=0.27"]
dev = ["pytest", "hypothesis", "ruff", "mypy", "httpx", "fastapi>=0.110", "uvicorn>=0.27"]

[project.scripts]
saint = "pysaint.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["pysaint"]
artifacts = ["pysaint/api/static/*"]

[tool.ruff]
line-length = 100

[tool.ruff.lint.per-file-ignores]
"pysaint/cli.py" = ["B008"]  # typer idiom
"pysaint/api/app.py" = ["B008"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["pysaint/model", "pysaint/kernel", "pysaint/continuous"]

[tool.pytest.ini_options]
testpaths = ["tests"]
